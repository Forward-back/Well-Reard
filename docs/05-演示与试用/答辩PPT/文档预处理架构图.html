<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文档预处理数据流架构图 · WellRead</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #FFFFFF;
      --color-ink: #1F3864;
      --color-muted: #5B6B7F;
      --color-soft: #7A8798;
      --color-accent: #A67C2E;
      --color-accent-tint: rgba(166, 124, 46, 0.08);
      --color-rule: rgba(31, 56, 100, 0.12);
      --font-sans: 'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif SC', 'Songti SC', STSong, SimSun, serif;
      --font-mono: 'Geist Mono', 'Noto Sans Mono CJK SC', monospace;
    }
    html, body { background: var(--color-paper); }
    body { display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; }
    svg { display: block; width: 1280px; height: 720px; }
  </style>
</head>
<body>
  <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img"
       aria-labelledby="doc-preprocess-title doc-preprocess-desc"
       font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">
    <title id="doc-preprocess-title">文档预处理数据流架构图</title>
    <desc id="doc-preprocess-desc">从文件上传或 URL 导入开始，经接入去重、格式解析、按需 OCR 与图片补全、清洗规范化，最终切分为文档块；图止步于分块，索引与检索不在范围内。</desc>

    <defs>
      <marker id="doc-preprocess-arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#5B6B7F"/>
      </marker>
      <marker id="doc-preprocess-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#A67C2E"/>
      </marker>
      <marker id="doc-preprocess-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#8A97A8"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#FFFFFF"/>

    <!-- Page-level labels -->
    <text x="40" y="64" fill="#5B6B7F" font-size="12" font-weight="500" letter-spacing="0.18em"
          font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">文档预处理</text>

    <g transform="translate(0 40)">

    <!-- Zones (drawn before arrows and nodes) -->
    <rect x="24" y="220" width="368" height="192" rx="8" fill="rgba(31,56,100,0.02)" stroke="rgba(31,56,100,0.10)" stroke-width="0.8"/>
    <rect x="392" y="220" width="320" height="192" rx="8" fill="rgba(31,56,100,0.02)" stroke="rgba(31,56,100,0.10)" stroke-width="0.8"/>
    <rect x="712" y="220" width="528" height="192" rx="8" fill="rgba(31,56,100,0.02)" stroke="rgba(31,56,100,0.10)" stroke-width="0.8"/>
    <text x="40" y="244" fill="#5B6B7F" font-size="12" font-weight="500" letter-spacing="0.12em"
          font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">接入</text>
    <text x="408" y="244" fill="#5B6B7F" font-size="12" font-weight="500" letter-spacing="0.12em"
          font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">解析与补全</text>
    <text x="728" y="244" fill="#5B6B7F" font-size="12" font-weight="500" letter-spacing="0.12em"
          font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">清洗与分块</text>

    <!-- Arrows (drawn before nodes) -->
    <path d="M 200 316 H 248" fill="none" stroke="#5B6B7F" stroke-width="1" marker-end="url(#doc-preprocess-arrow-muted)"/>
    <path d="M 368 316 H 408" fill="none" stroke="#5B6B7F" stroke-width="1" marker-end="url(#doc-preprocess-arrow-muted)"/>
    <path d="M 528 316 H 568" fill="none" stroke="#5B6B7F" stroke-width="1" marker-end="url(#doc-preprocess-arrow-muted)"/>
    <path d="M 688 316 H 728" fill="none" stroke="#5B6B7F" stroke-width="1" marker-end="url(#doc-preprocess-arrow-muted)"/>
    <path d="M 848 316 H 888" fill="none" stroke="#5B6B7F" stroke-width="1" marker-end="url(#doc-preprocess-arrow-muted)"/>
    <path d="M 1008 316 H 1048" fill="none" stroke="#A67C2E" stroke-width="1.2" marker-end="url(#doc-preprocess-arrow-accent)"/>

    <!-- Input node -->
    <g id="doc-preprocess-entry">
      <rect x="40" y="268" width="160" height="96" rx="6" fill="#F4F6FA" stroke="#5B7290" stroke-width="1"/>
      <text x="120" y="308" fill="#1F3864" font-size="16" font-weight="600" text-anchor="middle"
            font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', STSong, SimSun, serif">文档进入</text>
      <text x="120" y="332" fill="#5B6B7F" font-size="12" text-anchor="middle"
            font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">上传 · URL 导入</text>
    </g>

    <!-- Stage 01 -->
    <g id="doc-preprocess-intake">
      <rect x="248" y="268" width="120" height="96" rx="6" fill="#FFFFFF" stroke="#1F3864" stroke-width="1"/>
      <rect x="256" y="276" width="24" height="12" rx="2" fill="none" stroke="rgba(31,56,100,0.40)" stroke-width="0.8"/>
      <text x="268" y="284" fill="#1F3864" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="0.08em"
            font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">01</text>
      <text x="308" y="308" fill="#1F3864" font-size="16" font-weight="600" text-anchor="middle"
            font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', STSong, SimSun, serif">接入与去重</text>
      <text x="308" y="332" fill="#5B6B7F" font-size="12" text-anchor="middle"
            font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">校验 · 去重</text>
    </g>

    <!-- Stage 02 -->
    <g id="doc-preprocess-parse">
      <rect x="408" y="268" width="120" height="96" rx="6" fill="#FFFFFF" stroke="#1F3864" stroke-width="1"/>
      <rect x="416" y="276" width="24" height="12" rx="2" fill="none" stroke="rgba(31,56,100,0.40)" stroke-width="0.8"/>
      <text x="428" y="284" fill="#1F3864" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="0.08em"
            font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">02</text>
      <text x="468" y="308" fill="#1F3864" font-size="16" font-weight="600" text-anchor="middle"
            font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', STSong, SimSun, serif">文档解析</text>
      <text x="468" y="332" fill="#5B6B7F" font-size="12" text-anchor="middle"
            font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">格式解析 · 分页</text>
    </g>

    <!-- Stage 03: optional multimodal -->
    <g id="doc-preprocess-multimodal">
      <rect x="568" y="268" width="120" height="96" rx="6" fill="#FAFBFC" stroke="#7A8798" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="576" y="276" width="24" height="12" rx="2" fill="none" stroke="rgba(122,135,152,0.40)" stroke-width="0.8"/>
      <text x="588" y="284" fill="#7A8798" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="0.08em"
            font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">03</text>
      <rect x="640" y="276" width="40" height="16" rx="4" fill="#FFFFFF" stroke="rgba(122,135,152,0.40)" stroke-width="0.8"/>
      <text x="660" y="288" fill="#7A8798" font-size="12" text-anchor="middle"
            font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">按需</text>
      <text x="628" y="308" fill="#1F3864" font-size="16" font-weight="600" text-anchor="middle"
            font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', STSong, SimSun, serif">多模态补全</text>
      <text x="628" y="332" fill="#5B6B7F" font-size="12" text-anchor="middle"
            font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">OCR · 图片回写</text>
    </g>

    <!-- Stage 04 -->
    <g id="doc-preprocess-clean">
      <rect x="728" y="268" width="120" height="96" rx="6" fill="#FFFFFF" stroke="#1F3864" stroke-width="1"/>
      <rect x="736" y="276" width="24" height="12" rx="2" fill="none" stroke="rgba(31,56,100,0.40)" stroke-width="0.8"/>
      <text x="748" y="284" fill="#1F3864" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="0.08em"
            font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">04</text>
      <text x="788" y="308" fill="#1F3864" font-size="16" font-weight="600" text-anchor="middle"
            font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', STSong, SimSun, serif">清洗与规范化</text>
      <text x="788" y="332" fill="#5B6B7F" font-size="12" text-anchor="middle"
            font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">换行 · 字符 · 结构</text>
    </g>

    <!-- Stage 05 -->
    <g id="doc-preprocess-chunk">
      <rect x="888" y="268" width="120" height="96" rx="6" fill="#FFFFFF" stroke="#1F3864" stroke-width="1"/>
      <rect x="896" y="276" width="24" height="12" rx="2" fill="none" stroke="rgba(31,56,100,0.40)" stroke-width="0.8"/>
      <text x="908" y="284" fill="#1F3864" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="0.08em"
            font-family="'Geist Mono', 'Noto Sans Mono CJK SC', monospace">05</text>
      <text x="948" y="308" fill="#1F3864" font-size="16" font-weight="600" text-anchor="middle"
            font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', STSong, SimSun, serif">分块</text>
      <text x="948" y="332" fill="#5B6B7F" font-size="12" text-anchor="middle"
            font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">切分 · 父子块</text>
    </g>

    <!-- Output: chunks (focal) -->
    <g id="doc-preprocess-output">
      <rect x="1048" y="268" width="120" height="96" rx="6" fill="rgba(166,124,46,0.08)" stroke="#A67C2E" stroke-width="1.2"/>
      <text x="1108" y="308" fill="#1F3864" font-size="16" font-weight="600" text-anchor="middle"
            font-family="'Instrument Serif', 'Noto Serif SC', 'Songti SC', STSong, SimSun, serif">文档块</text>
      <text x="1108" y="332" fill="#8A6A3B" font-size="12" text-anchor="middle"
            font-family="'Geist', 'Noto Sans SC', 'Microsoft YaHei', sans-serif">CHUNKS · 检索单元</text>
    </g>
    </g>
  </svg>
</body>
</html>

            $ref: '#/definitions/gaze_internal_types.GazeFolder'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gaze_internal_errors.AppError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/gaze_internal_errors.AppError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/gaze_internal_errors.AppError'

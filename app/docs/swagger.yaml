      - VectorStore
    put:
      consumes:
      - application/json
      description: Update a vector store (name only). Engine type, connection config,
        and index config are immutable. Env stores cannot be modified.
      parameters:
      - description: Vector store ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.UpdateStoreRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated vector store
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Env store or validation error
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Vector store not found
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Update vector store
      tags:
      - VectorStore
  /vector-stores/{id}/test:
    post:
      description: Test connectivity of an existing saved or env store. Returns detected
        server version. For DB stores, the version is automatically saved to connection_config.
      parameters:
      - description: Vector store ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Connection test result (success, version)
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Vector store not found
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Test vector store connection by ID
      tags:
      - VectorStore
  /vector-stores/test:
    post:
      consumes:
      - application/json
      description: Test connectivity using provided credentials without persisting.
        Returns detected server version.
      parameters:
      - description: Engine type and connection config
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.TestStoreRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Connection test result (success, version)
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/gaze_internal_errors.AppError'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Test vector store connection with raw credentials
      tags:
      - VectorStore
  /vector-stores/types:
    get:
      description: Return supported engine types with connection and index field schemas
        for UI form generation
      produces:
      - application/json
      responses:
        "200":
          description: List of engine types with config schemas
          schema:
            additionalProperties: true
            type: object
      summary: List vector store types
      tags:
      - VectorStore
securityDefinitions:
  ApiKeyAuth:
    description: API Key 认证：空间 Key 固定访问所属空间；平台 Key 调用空间接口时需同时传 X-Tenant-ID
    in: header
    name: X-API-Key
    type: apiKey
  Bearer:
    description: 用户登录认证：输入 Bearer {token} 格式的 JWT 令牌
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"

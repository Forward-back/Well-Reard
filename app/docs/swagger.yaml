  /auth/switch-tenant:
    post:
      consumes:
      - application/json
      description: |-
        为当前用户在目标空间重新签发访问令牌；要求该用户在目标空间存在 active 成员关系（跨租户超级用户除外）。
        成功换签会把目标空间写入「最近活跃租户」偏好，下次登录与 refresh 都落在该空间（refresh JWT 不含 tenant_id）。
        该偏好是账号级的：一次换签会改变该用户所有设备的下次登录/refresh 落点。偏好写入失败则整次换签失败，不会发出新 token。
      parameters:
      - description: 切换请求
        in: body
        name: request
        required: true
        schema:
          properties:
            refresh_token:
              type: string
            tenant_id:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gaze_internal_types.LoginResponse'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/gaze_internal_errors.AppError'
        "403":
          description: 无该空间成员关系或偏好写入失败
          schema:
            $ref: '#/definitions/gaze_internal_errors.AppError'
      security:
      - Bearer: []
      summary: 切换激活空间
      tags:
      - 认证

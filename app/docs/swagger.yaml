  /knowledgebase/{kb_id}/gaze/graph:
    get:
      description: |-
        Returns a slice of the gaze link graph for visualization. Supports
        `mode=overview` (top-N most-connected pages, default) and
        `mode=ego` (BFS neighborhood of a center slug) to keep response
        size tractable for knowledge bases with tens of thousands of pages.
      parameters:
      - description: Knowledge base ID
        in: path
        name: kb_id
        required: true
        type: string
      - description: overview (default) | ego
        in: query
        name: mode
        type: string
      - description: Center slug for ego mode
        in: query
        name: center
        type: string
      - description: Ego BFS depth (1-3, default 1)
        in: query
        name: depth
        type: integer
      - description: Comma-separated page_type allow-list
        in: query
        name: types
        type: string
      - description: Max nodes to return (default 500, max 2000)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gaze_internal_types.GazeGraphData'
      security:
      - Bearer: []
      summary: Get gaze link graph
      tags:
      - Gaze
  /knowledgebase/{kb_id}/gaze/index:
    get:
      description: |-
        Returns the gaze index as intro text plus per-type paginated
        directory groups. The heavy directory markdown that used to
        live in gaze_pages.content was replaced with this structured
        response so a KB with tens of thousands of pages no longer
        materializes megabytes of TEXT on every index open.
      parameters:
      - description: Knowledge base ID
        in: path
        name: kb_id
        required: true
        type: string
      - description: 'Comma-separated page types (default: all content types)'
        in: query
        name: types
        type: string
      - description: Per-group window size, 1-200 (default 50)
        in: query
        name: limit
        type: integer
      - description: Opaque offset cursor from previous response
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gaze_internal_types.GazeIndexResponse'
      security:
      - Bearer: []
      summary: Get gaze index view
      tags:
      - Gaze
  /knowledgebase/{kb_id}/gaze/move-page:
    put:
      consumes:
      - application/json

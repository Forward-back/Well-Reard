info:
  contact:
    name: Gaze Github
    url: https://gaze
  description: Gaze 知识库管理系统 API 文档
  termsOfService: http://swagger.io/terms/
  title: Gaze API
  version: "1.0"
paths:
  /agent-chat/{session_id}:
    post:
      consumes:
      - application/json
      description: 基于Agent的智能问答，支持多轮对话和SSE流式响应
      parameters:
      - description: 会话ID
        in: path
        name: session_id
        required: true
        type: string
      - description: 问答请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler_session.CreateKnowledgeQARequest'
      - default: handle
        description: 文件引用形式，public 返回可加载直链
        enum:
        - handle
        - public
        in: query
        name: resource_urls
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: 问答结果（SSE流）
          schema:
            additionalProperties: true
            type: object
        "400":

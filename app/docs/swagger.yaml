      consumes:
      - application/json
      description: Update a storage backend's mutable fields (name, credentials, status).
        Provider and physical location (endpoint, region, bucket, path prefix) are
        immutable; use storage migration to move data. Environment-sourced backends
        are read-only. Redacted secret placeholders preserve the stored credentials.
      parameters:
      - description: Storage backend ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated storage backend fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.storageBackendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated storage backend
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Immutable field change, read-only backend, validation, or connectivity

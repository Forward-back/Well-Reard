  /knowledgebase/{kb_id}/gaze/pages/{slug}:
    delete:
      description: Soft-delete a gaze page by slug
      parameters:
      - description: Knowledge base ID
        in: path
        name: kb_id
        required: true
        type: string
      - description: Page slug
        in: path
        name: slug
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/gaze_internal_errors.AppError'
      security:
      - Bearer: []
      summary: Delete a gaze page
      tags:
      - Gaze
    get:
      description: Retrieve a gaze page by its slug
      parameters:
      - description: Knowledge base ID
        in: path
        name: kb_id
        required: true
        type: string
      - description: Page slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gaze_internal_types.GazePage'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/gaze_internal_errors.AppError'
      security:
      - Bearer: []
      summary: Get a gaze page by slug
      tags:
      - Gaze
    put:
      consumes:
      - application/json
      description: |-
        Partially update a gaze page by slug. Absent fields keep
        their stored value. When `version` is > 0 it acts as an
        optimistic-lock guard: a mismatch with the stored version
        returns 409 together with the current version so the client
        can reload and re-apply.
      parameters:
      - description: Knowledge base ID
        in: path
        name: kb_id
        required: true
        type: string
      - description: Page slug
        in: path
        name: slug
        required: true
        type: string
      - description: Fields to update
        in: body
        name: page
        required: true
        schema:
          $ref: '#/definitions/gaze_internal_types.GazePageUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gaze_internal_types.GazePage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gaze_internal_errors.AppError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/gaze_internal_errors.AppError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/gaze_internal_errors.AppError'
      security:
      - Bearer: []
      summary: Update a gaze page
      tags:
      - Gaze
  /knowledgebase/{kb_id}/gaze/rebuild-links:
    post:
      description: Re-parse all pages and rebuild bidirectional link references
      parameters:
      - description: Knowledge base ID
        in: path
        name: kb_id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - Bearer: []
      summary: Rebuild gaze links
      tags:
      - Gaze
  /knowledgebase/{kb_id}/gaze/revert:
    post:
      consumes:
      - application/json
      description: |-
        Rolls the page (slug in the body, like move-page) back to
        the content of the given stored revision. Applied as a
        regular edit: the pre-revert state is snapshotted and the
        version advances.
      parameters:
      - description: Knowledge base ID
        in: path
        name: kb_id
        required: true
        type: string
      - description: Revert target
        in: body
        name: revert
        required: true
        schema:
          $ref: '#/definitions/gaze_internal_types.GazePageRevertRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gaze_internal_types.GazePage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/gaze_internal_errors.AppError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/gaze_internal_errors.AppError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/gaze_internal_errors.AppError'
      security:
      - Bearer: []
      summary: Revert a gaze page to an earlier revision
      tags:
      - Gaze
  /knowledgebase/{kb_id}/gaze/revisions/{slug}:
    get:
      description: |-
        Returns the stored historical snapshots for a page, newest
        first (content omitted), plus the current version. Passing
        `version` returns that single snapshot with full content.
      parameters:
      - description: Knowledge base ID
        in: path
        name: kb_id
        required: true
        type: string
      - description: Page slug
        in: path
        name: slug
        required: true
        type: string
      - description: Return this single revision with content
        in: query
        name: version
        type: integer
      - description: Page size (default 50, max 200)
        in: query
        name: limit
        type: integer
      - description: Offset into the newest-first list
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gaze_internal_types.GazePageRevisionListResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/gaze_internal_errors.AppError'
      security:
      - Bearer: []
      summary: List gaze page revisions
      tags:
      - Gaze
  /knowledgebase/{kb_id}/gaze/search:
    get:
      description: Full-text search over gaze pages
      parameters:
      - description: Knowledge base ID
        in: path
        name: kb_id
        required: true
        type: string
      - description: Search query
        in: query
        name: q
        required: true

      tags:
      - StorageBackend
  /system/admin/api-keys:
    get:
      description: Lists non-workspace API keys. Full tokens are always masked. Human
        SystemAdmin only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: List platform API keys
      tags:
      - System Admin
    post:
      consumes:
      - application/json
      description: Creates a capability-scoped key that may target any workspace through
        X-Tenant-ID. The plaintext token is returned once. Human SystemAdmin only.
      parameters:
      - description: Platform API key
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.platformAPIKeyCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: Create a platform API key
      tags:
      - System Admin
  /system/admin/api-keys/{key_id}:
    delete:
      description: Immediately revokes a platform API key. Human SystemAdmin only.
      parameters:
      - description: API key ID
        in: path
        name: key_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []

      description: Delete a data source (soft delete)
      parameters:
      - description: Data source ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a data source
      tags:
      - DataSource
    get:
      description: Retrieve a data source configuration by ID
      parameters:
      - description: Data source ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gaze_internal_types.DataSource'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a data source by ID
      tags:
      - DataSource
    put:
      consumes:
      - application/json
      description: Update an existing data source configuration
      parameters:
      - description: Data source ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gaze_internal_types.DataSource'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gaze_internal_types.DataSource'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a data source
      tags:
      - DataSource
  /datasource/{id}/logs:
    get:
      description: Retrieve sync history for a data source
      parameters:
      - description: Data source ID
        in: path
        name: id
        required: true
        type: string
      - description: 'Limit (default: 10)'
        in: query
        name: limit
        type: integer
      - description: 'Offset (default: 0)'
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/gaze_internal_types.SyncLog'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get sync logs
      tags:
      - DataSource
  /datasource/{id}/pause:
    post:
      description: Pause a data source's scheduled syncs
      parameters:
      - description: Data source ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Pause data source
      tags:
      - DataSource
  /datasource/{id}/resource-ancestors:
    post:
      consumes:
      - application/json
      description: Resolve the ancestor ExternalIDs that must be expanded to reveal
        the given (possibly deeply nested) resources in a lazily-loaded picker. Used
        to restore an existing selection when editing a data source.
      parameters:
      - description: Data source ID
        in: path
        name: id
        required: true
        type: string
      - description: Resource IDs to resolve
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handler.resolveAncestorsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                type: string
              type: array
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Resolve resource ancestors
      tags:
      - DataSource
  /datasource/{id}/resources:
    get:
      description: List resources available for sync in the external system. Pass
        parent_id to lazily load the direct children of a resource (used for large
        hierarchical sources such as Feishu gaze).
      parameters:
      - description: Data source ID
        in: path
        name: id
        required: true
        type: string
      - description: Parent resource ExternalID; empty lists the top level
        in: query
        name: parent_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/gaze_internal_types.Resource'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List available resources in data source
      tags:
      - DataSource
  /datasource/{id}/resume:
    post:
      description: Resume a paused data source
      parameters:
      - description: Data source ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Resume data source
      tags:
      - DataSource
  /datasource/{id}/sync:
    post:
      description: Trigger an immediate sync for a data source
      parameters:
      - description: Data source ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gaze_internal_types.SyncLog'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Trigger immediate sync
      tags:
      - DataSource

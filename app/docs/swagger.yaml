  gaze_internal_types.AutoTagConfig:
    properties:
      enabled:
        type: boolean
      max_tags:
        type: integer
      model_id:
        type: string
      skip_if_tagged:
        description: |-
          SkipIfTagged leaves documents that already carry tags untouched, so a
          deliberate manual classification is not diluted by model guesses. It is
          a pointer because the default is true: rows written before this field
          existed decode to nil and must not silently flip to "always append".
        type: boolean
    type: object
  gaze_internal_types.COSEngineConfig:
    properties:
      app_id:
        type: string
      bucket_name:
        type: string
      path_prefix:
        type: string
      region:
        type: string
      secret_id:
        type: string
      secret_key:
        type: string
      temp_bucket_name:
        type: string
      temp_region:
        type: string
    type: object
  gaze_internal_types.ChatHistoryConfig:
    properties:
      embedding_model_id:
        description: |-
          EmbeddingModelID is the ID of the embedding model used for vectorizing chat messages.
          Once messages have been indexed, the model cannot be changed (requires re-indexing).
        type: string
      enabled:
        description: Enabled controls whether chat history indexing is active
        type: boolean
      knowledge_base_id:
        description: |-
          KnowledgeBaseID is the auto-managed hidden knowledge base for chat history.
          This is set internally when the feature is first enabled; users should not set this directly.
        type: string
    type: object
  gaze_internal_types.ChunkingConfig:
    properties:
      child_chunk_size:
        description: |-
          ChildChunkSize is the size of child chunks used for embedding (default: 384).
          Only used when EnableParentChild is true.
        type: integer
      chunk_overlap:
        description: Chunk overlap
        type: integer
      chunk_size:
        description: Chunk size
        type: integer
      enable_parent_child:
        description: |-
          EnableParentChild enables two-level parent-child chunking strategy.
          When enabled, large parent chunks provide context while small child chunks
          are used for vector matching. Retrieval matches on child but returns parent content.
        type: boolean
      languages:
        description: |-
          Languages hints the heuristic patterns. Empty = auto-detect from content.
          Examples: ["de"], ["en", "zh"].
        items:
          type: string
        type: array
      parent_chunk_size:
        description: |-
          ParentChunkSize is the size of parent chunks (default: 4096).
          Only used when EnableParentChild is true.
        type: integer
      parser_engine_rules:
        description: |-
          ParserEngineRules configures which parser engine to use for each file type.
          When empty, DefaultParserEngine is used (builtin/simple routing, except
          types that only a specific engine can parse: ppt/pptx fall back to
          markitdown). A linked anydoc binding is preferred for every type it
          converts.
        items:
          $ref: '#/definitions/gaze_internal_types.ParserEngineRule'
        type: array
      separators:
        description: Separators
        items:
          type: string
        type: array
      strategy:
        description: |-
          Strategy selects the adaptive chunking tier. Empty / "legacy" preserves
          the historical recursive splitter; "auto" lets a profiler pick between
          heading-aware, heuristic and recursive tiers; "heading" / "heuristic" /
          "recursive" pin the tier explicitly.
        type: string
      table_metadata_instructions:
        description: |-
          TableMetadataInstructions contains optional business guidance used when
          generating searchable summaries for CSV/Excel tables. The system-owned
          output contract remains fixed; these instructions only add domain context.
        type: string
      token_limit:
        description: |-
          TokenLimit caps chunk size in approximate tokens. 0 = use ChunkSize
          as a character count.
        type: integer
    type: object
  gaze_internal_types.ConnectionConfig:
    properties:
      addr:
        description: Common
        type: string
      api_key:
        description: AES-GCM encrypted
        type: string
      database:
        description: |-
          Database name used by engines that support database-level namespaces
          (currently Milvus, Tencent VectorDB, and Doris).
        type: string
      grpc_address:
        description: Weaviate
        type: string
      host:
        description: Qdrant
        type: string
      http_port:
        description: |-
          Doris: HTTP port for Stream Load API (FE default 8030).
          Addr is reused for the MySQL protocol "host:9030"; HTTPPort + the host of Addr
          together form the FE HTTP endpoint used by Stream Load.
        type: integer
      insecure_skip_verify:
        description: |-
          InsecureSkipVerify disables TLS certificate verification when
          talking to the backing store over HTTPS. Defaults to false
          (secure). Set to true ONLY for self-signed development clusters;
          production deployments should provide trusted certificates via
          the system CA pool. Cross-driver applicable but currently only
          the OpenSearch driver (Phase 3) reads this field. Note: this
          differs from the Qdrant-specific UseTLS below, which *enables*
          TLS on gRPC connections — InsecureSkipVerify only controls
          *verification* of an already-TLS connection.
        type: boolean
      password:
        description: AES-GCM encrypted
        type: string
      port:
        type: integer
      scheme:
        type: string
      use_default_connection:
        description: Postgres
        type: boolean
      use_tls:
        type: boolean
      username:
        type: string
      version:
        description: |-
          Version is the detected server version (e.g., "7.10.1", "16.2", "1.12.6").
          Auto-populated by TestConnection on successful connectivity check.
        type: string
    type: object
  gaze_internal_types.ContextCompressionStrategy:
    enum:
    - sliding_window
    - smart
    type: string
    x-enum-varnames:
    - ContextCompressionSlidingWindow
    - ContextCompressionSmart
  gaze_internal_types.ContextConfig:
    properties:
      compression_strategy:
        allOf:
        - $ref: '#/definitions/gaze_internal_types.ContextCompressionStrategy'
        description: 'Compression strategy: "sliding_window" or "smart"'
      max_tokens:
        description: Maximum tokens allowed in LLM context
        type: integer
      recent_message_count:
        description: |-
          For sliding_window: number of messages to keep
          For smart: number of recent messages to keep uncompressed
        type: integer
      summarize_threshold:
        description: 'Summarize threshold: number of messages before summarization'
        type: integer
    type: object
  gaze_internal_types.CredentialsConfig:
    type: object
  gaze_internal_types.CubeEgressRule:
    properties:
      audit:
        description: Audit is none | metadata | full. Empty uses the server default.
        type: string
      deny:
        description: |-
          Deny inverts the action, which defaults to allow. A deny rule still
          needs Host or SNI: the target has to reach CubeEgress for it to answer
          with a request-level 403 instead of the network layer dropping it.
        type: boolean
      host:
        type: string
      inject:
        description: Inject adds credential headers on allowed HTTPS requests.
        items:
          $ref: '#/definitions/gaze_internal_types.CubeHeaderInject'
        type: array
      methods:
        items:
          type: string
        type: array
      name:
        type: string
      path:
        type: string
      scheme:
        type: string
      sni:
        type: string
    type: object
  gaze_internal_types.CubeHeaderInject:
    properties:
      format:
        type: string
      header:
        type: string
      secret:
        type: string
    type: object
  gaze_internal_types.CubeSandboxConfig:
    properties:
      api_key:
        description: 加密
        type: string
      api_url:
        type: string
      cube_sandbox_ttl_seconds:
        type: integer
      dns_servers:
        description: DNSServers are Cube template nameserver IPs. Empty uses Cubelet's
          default.
        items:
          type: string
        type: array
      http_timeout_sec:
        description: |-
          HTTPTimeoutSec bounds each HTTP call to the sandbox control plane.
          0 means use the built-in default (30s), never the deployment's value.
        type: integer
      proxy_url:
        type: string
      sandbox_domain:
        type: string
      template_id:
        type: string
    type: object
  gaze_internal_types.DataSource:
    properties:
      config:
        description: |-
          Encrypted configuration (API credentials, tokens, etc.)
          Stored as JSON with AES-256-GCM encryption
        items:
          type: integer
        type: array
      conflict_strategy:
        description: 'Conflict resolution strategy: overwrite or skip'
        type: string
      created_at:
        description: Creation timestamp
        type: string
      deleted_at:
        allOf:
        - $ref: '#/definitions/gorm.DeletedAt'
        description: Soft delete timestamp
      error_message:
        description: Error message if status is "error"
        type: string
      id:
        description: Unique identifier
        type: string
      knowledge_base_id:
        description: Target knowledge base ID
        type: string
      last_sync_at:
        description: Last successful sync timestamp
        type: string
      last_sync_cursor:
        description: Cursor or state for incremental sync (connector-specific)
        items:
          type: integer
        type: array
      last_sync_result:
        description: Summary of last sync result
        items:
          type: integer
        type: array
      latest_sync_log:
        allOf:
        - $ref: '#/definitions/gaze_internal_types.SyncLog'
        description: Latest sync log (not stored in DB, populated on query)
      name:
        description: User-friendly name
        type: string
      status:
        description: 'Current status: active, paused, error'
        type: string
      sync_deletions:
        description: Whether to sync deletions from source
        type: boolean
      sync_log_retention_days:
        description: 'Number of days to keep sync logs (default: 30)'
        type: integer
      sync_mode:
        description: 'Sync mode: "incremental" (recommended) or "full"'
        type: string
      sync_schedule:
        description: Cron expression for scheduled syncs (e.g., "0 */6 * * *" = every
          6 hours)
        type: string
      tenant_id:
        description: Workspace ID for multi-workspace isolation
        type: integer
      total_items_synced:
        description: Total items synced (not stored in DB, calculated on query)
        type: integer
      type:
        description: Connector type (feishu, notion, confluence, etc.)
        type: string
      updated_at:
        description: Last update timestamp
        type: string
    type: object
  gaze_internal_types.DepartmentRole:
    enum:
    - manager
    - knowledge_admin
    - editor
    - viewer
    type: string
    x-enum-varnames:
    - DepartmentRoleManager
    - DepartmentRoleKnowledgeAdmin
    - DepartmentRoleEditor
    - DepartmentRoleViewer
  gaze_internal_types.DockerSandboxConfig:
    properties:
      cpu_limit:
        description: |-
          CPULimit is the number of CPU cores one sandbox may use. 0 uses the
          built-in default.
        type: number
      host:
        description: |-
          Host is the daemon endpoint in DOCKER_HOST form. Empty means the local
          unix socket.
        type: string
      http_timeout_sec:
        description: HTTPTimeoutSec bounds each Engine API call. 0 uses the built-in
          default.
        type: integer
      idle_ttl_seconds:
        description: |-
          IdleTTLSeconds is how long a session container may go unused before it
          is reclaimed. The daemon has no idle timeout of its own, so this is what
          stops an abandoned session from pinning host memory indefinitely.
        type: integer
      image:
        type: string
      memory_limit_mb:
        description: MemoryLimitMB caps one sandbox's memory. 0 uses the built-in
          default.
        type: integer
      network_mode:
        description: |-
          NetworkMode is the Docker network sandboxes join: "bridge" (default) or
          "none" for no egress. Nothing else is accepted — host and container:
          modes share another namespace outright, and a named network is usually
          the deployment's own compose network, which would put the sandbox next
          to Postgres and Redis.
        type: string
      pids_limit:
        description: |-
          PidsLimit caps how many processes one sandbox may run. 0 uses the
          built-in default.
        type: integer
      runtime:
        description: |-
          Runtime selects an alternative OCI runtime such as "runsc" (gVisor).
          Empty uses the daemon default.
        type: string
      tls_cert_path:
        description: |-
          TLSCertPath is a directory on the Gaze host containing ca.pem,
          cert.pem and key.pem. Required when Host is a TCP endpoint.
        type: string
    type: object
  gaze_internal_types.E2BHostRule:
    properties:
      headers:
        additionalProperties:
          type: string
        description: |-
          Headers values are credentials and are encrypted at rest; names stay
          readable so operators can see which headers are injected.
        type: object
      host:
        type: string
    type: object
  gaze_internal_types.E2BSandboxConfig:
    properties:
      api_key:
        description: 加密
        type: string
      api_url:
        type: string
      e2b_sandbox_ttl_seconds:
        type: integer
      http_timeout_sec:
        description: |-
          HTTPTimeoutSec bounds each HTTP call to the sandbox control plane.
          0 means use the built-in default (30s), never the deployment's value.
        type: integer
      proxy_url:
        description: |-
          ProxyURL is the data-plane gateway that fronts envd. E2B Cloud resolves
          "<port>-<sandboxID>.<sandbox_domain>" through public DNS and TLS, so it
          needs no value here. Self-hosted E2B-compatible control planes usually
          serve every sandbox from one gateway address and expect the sandbox
          authority in the Host header; setting this makes Gaze dial the
          gateway directly instead of requiring wildcard DNS and a certificate
          for the sandbox domain. An "http://" gateway also downgrades the

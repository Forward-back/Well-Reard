          description: Invalid request or validation error
          schema:
            $ref: '#/definitions/gaze_internal_errors.AppError'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      - ApiKeyAuth: []

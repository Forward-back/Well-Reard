          schema:
            $ref: '#/definitions/gaze_internal_errors.AppError'
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Storage backend not found
          schema:
            $ref: '#/definitions/gaze_internal_errors.AppError'
      security:
      - Bearer: []
      - ApiKeyAuth: []
      summary: Update storage backend
      tags:
      - StorageBackend
